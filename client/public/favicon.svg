<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Lens Rim Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Scan Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="5.5" y="5.5" width="89" height="89" rx="22.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Document 1 (Back Sheet) -->
  <path d="M28 24 C28 22 29.5 20.5 31.5 20.5 L55 20.5 L67 32.5 L67 68 C67 70 65.5 71.5 63.5 71.5 L31.5 71.5 C29.5 71.5 28 70 28 68 Z" fill="#FFFFFF" fill-opacity="0.18" />

  <!-- Document 2 (Front Sheet) -->
  <g filter="url(#glow)">
    <path d="M24 28 C24 25.8 25.8 24 28 24 L52 24 L64 36 L64 74 C64 76.2 62.2 78 60 78 L28 78 C25.8 78 24 76.2 24 74 Z" fill="#FFFFFF" fill-opacity="0.95" />
    <!-- Folded Corner -->
    <path d="M52 24 L64 36 L54 36 C52.9 36 52 35.1 52 34 Z" fill="#CBD5E1" />
  </g>

  <!-- Document Content Text Lines -->
  <rect x="30" y="38" width="18" height="3" rx="1.5" fill="#6366F1" />
  <rect x="30" y="45" width="26" height="2.5" rx="1.25" fill="#94A3B8" />
  <rect x="30" y="51" width="24" height="2.5" rx="1.25" fill="#94A3B8" />
  <rect x="30" y="57" width="20" height="2.5" rx="1.25" fill="#94A3B8" />
  
  <!-- Highlighted Copied / Match Line (Orange/Red indicator) -->
  <rect x="30" y="63" width="22" height="2.5" rx="1.25" fill="#EF4444" fill-opacity="0.85" />

  <!-- Scanner Beam Line Across Document -->
  <rect x="24" y="50" width="40" height="3" fill="url(#beamGrad)" />

  <!-- PlagScan Lens (Magnifying Glass / Optical Sensor) -->
  <g transform="translate(14, 12)">
    <!-- Lens Handle -->
    <path d="M53 53 L66 66" stroke="#0F172A" stroke-width="6.5" stroke-linecap="round" />
    <path d="M53 53 L66 66" stroke="url(#lensGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Lens Glass Background with soft glow -->
    <circle cx="43" cy="43" r="16" fill="#38BDF8" fill-opacity="0.25" />
    
    <!-- Lens Outer Rim -->
    <circle cx="43" cy="43" r="16" fill="none" stroke="url(#lensGrad)" stroke-width="4" filter="url(#glow)" />
    
    <!-- AI Scan Center / Checkmark inside Lens -->
    <path d="M38 43 L41.5 46.5 L48 40" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkle AI Stars -->
  <path d="M72 16 Q72 21 77 21 Q72 21 72 26 Q72 21 67 21 Q72 21 72 16 Z" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="21" cy="20" r="2" fill="#F472B6" />
</svg>
